<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame annotation</title>
  <style>
    :root { --bg: #f9f9f9; --surface: #ffffff; --ink: #191919; --ink-2: #666666; --line: #e7e7e7; --accent: #257de0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0b0b; --surface: #191919; --ink: #efefef; --ink-2: #9c9c9c; --line: #303030; --accent: #338ced; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    .muted { color: var(--ink-2); font-size: 0.9rem; }
    img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 12px 0; }
    fieldset { border: 0; padding: 0; margin: 16px 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    label.choice { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    label.choice:has(input:checked) { border-color: var(--accent); outline: 2px solid var(--accent); }
    button { font: inherit; padding: 10px 18px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; max-width: 360px; }
    progress { width: 100%; height: 8px; }
    .error { color: #dc3c3d; }
  </style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
